name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main, feat/cloud-dashboard]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: FamilyTime-web-checks
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 14
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.112'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --version=3.09 -y --no-progress --allow-downgrade
      - name: Test and package
        shell: pwsh
        run: python packaging/build.py
      - name: Preserve installer, source and extension
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: FamilyTime-windows
          path: |
            artifacts/FamilyTime-*-Setup.exe
            artifacts/FamilyTime-*-Source.zip
            artifacts/FamilyTime-*-Extension.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Windows UI previews and checks
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: FamilyTime-ui-checks
          path: |
            artifacts/ui-checks/*
            artifacts/app/startup-check.txt
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FamilyTime-windows
          path: artifacts
      - name: Publish verified preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "v0.2.0 already exists; keeping its verified assets unchanged."
          else
            gh release create v0.2.0 artifacts/* --target "$RELEASE_COMMIT" --prerelease --title "Family Time 0.2.0 — личный кабинет" --notes "Adds optional cloud dashboard pairing in Settings → Личный кабинет. A separately deployed web account provides desktop/mobile charts, daily history and sessions. Offline observations are queued locally and synced automatically; retries do not duplicate time. Telegram is optional. The web account requires Vercel and Supabase setup; see docs/CLOUD.md. Based on v0.1.2, without shutdown reports. Install over v0.1.2 to preserve settings and local history."
          fi
