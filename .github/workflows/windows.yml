name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main, feat/shutdown-reports-0.1.3]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.112'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --version=3.09 -y --no-progress --allow-downgrade
      - name: Test and package
        shell: pwsh
        run: python packaging/build.py
      - name: Preserve installer, source and extension
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: FamilyTime-windows
          path: |
            artifacts/FamilyTime-*-Setup.exe
            artifacts/FamilyTime-*-Source.zip
            artifacts/FamilyTime-*-Extension.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Windows UI previews and checks
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: FamilyTime-ui-checks
          path: |
            artifacts/ui-checks/*
            artifacts/app/startup-check.txt
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FamilyTime-windows
          path: artifacts
      - name: Publish verified preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          gh release create v0.1.3 artifacts/* --target "$RELEASE_COMMIT" --prerelease --title "Family Time 0.1.3 — automatic shutdown reports" --notes "Adds an automatic report before Windows shutdown, restart or sign-out, enabled by default under Reports and data. The daily snapshot is saved before a bounded Telegram delivery attempt; failed delivery remains queued for the next launch. Reports describe the start of Windows session ending, not confirmation that power is off. Abrupt power loss cannot trigger delivery. Tests cover settings persistence, snapshot contents, deduplication, delivery timeout and retry, plus the WPF session-ending callback using a fake Telegram API. An actual PC shutdown with live Telegram remains a manual acceptance check. Install over the previous version to preserve family settings and history."
